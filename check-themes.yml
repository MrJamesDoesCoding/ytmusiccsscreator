name: Check themes
on:
  pull_request:
    paths: ['themes/**', 'js/theme.js', 'scripts/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build.mjs --check
